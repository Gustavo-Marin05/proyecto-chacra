<main id="main">
<section class="container tierra-wrap">
<div class="tierra-globo">
<div class="g-lienzo" id="globo" role="img" aria-label="Globo terráqueo en 3D con imágenes de la NASA"></div>
<p class="tierra-cargando" id="globo-estado">Cargando la Tierra…</p>
<div class="g-capas" role="group" aria-label="Capa de la NASA">
<button type="button" class="g-op" data-capa="detalle" aria-pressed="false">Satélite</button>
<button type="button" class="g-op" data-capa="verde" aria-pressed="false">Vegetación</button>
<button type="button" class="g-op" data-capa="temp" aria-pressed="false">Temperatura</button>
<button type="button" class="g-op" data-capa="lluvia" aria-pressed="false">Lluvia</button>
<button type="button" class="g-op" data-capa="fuego" aria-pressed="false">Incendios</button>
<button type="button" class="g-op" data-capa="tierra" aria-pressed="false">Mapa</button>
<button type="button" class="g-op" data-capa="noche" aria-pressed="false">Noche</button>
</div>
<div class="g-zoom">
<button type="button" id="z-mas" aria-label="Acercar">+</button>
<button type="button" id="z-menos" aria-label="Alejar">−</button>
</div>
<div class="g-vistas">
<button type="button" class="g-op" id="btn-scz">Santa Cruz</button>
<button type="button" class="g-op" id="btn-bolivia">Bolivia</button>
<button type="button" class="g-op" id="btn-giro" aria-pressed="false">Girar</button>
</div>
<p class="g-nota" id="capa-nota"></p>
</div>
<aside class="tierra-side">
<div class="panel" id="clima-panel" aria-live="polite">
<h2 id="cl-titulo">Toca un lugar</h2>
<p class="hint" id="cl-sub">Verás su lluvia y temperatura por mes.</p>
<dl class="cl-datos is-hidden" id="cl-datos"><div><dt>Lluvia al año</dt><dd id="cl-lluvia"></dd></div><div><dt>Altura</dt><dd id="cl-alt"></dd></div></dl>
<div class="cl-meses is-hidden" id="cl-meses"></div>
<p class="small is-hidden" id="cl-fuente"></p>
</div>
<div class="panel" id="ciudades-panel">
<div class="chips tierra-vista" role="group" aria-label="Qué lugares mostrar"><button type="button" class="chip is-selected" data-vista="scz" aria-pressed="true">Santa Cruz</button><button type="button" class="chip" data-vista="bolivia" aria-pressed="false">Bolivia</button></div>
<h2 id="lista-titulo">Pueblos de Santa Cruz</h2>
<ul class="ciudades-leyenda"><li><span class="ciudad-dot" style="background:#e65100"></span>&lt;600 mm</li><li><span class="ciudad-dot" style="background:#f5c518"></span>600–1000</li><li><span class="ciudad-dot" style="background:#43a047"></span>1000–1500</li><li><span class="ciudad-dot" style="background:#1565c0"></span>&gt;1500</li></ul>
<ul class="ciudades-lista" id="ciudades-lista" aria-live="polite"><li class="small hint">Cargando datos…</li></ul></div>
</aside>
</section>
